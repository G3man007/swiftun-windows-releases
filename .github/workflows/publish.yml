name: Publish

# The private build repository pushes a branch upload/<tag> with the files in dist/.
# This job turns it into a release and deletes the branch, so installers never stay in git history.
on:
  push:
    branches:
      - "upload/**"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#upload/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists" >&2
            exit 1
          fi
          gh release create "$tag" dist/*.exe dist/windows-update.json dist/SHA256SUMS.txt \
            --target main \
            --title "SwifTun Windows ${tag#v}" \
            --notes-file dist/notes.md \
            --latest
      - name: Delete upload branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
